# =============================================================================
# RAMP — Regime-Aware Mixture-of-Experts Post-Processor
# Hyperparameter Registry
# SIH26080 | configs/model_config.yaml
#
# This file defines the hyperparameter space and defaults for every model
# component in the RAMP pipeline. These are registered defaults; MLflow
# experiments may override them via experiment config.
#
# WARNING: Never commit tuned production hyperparameters with secrets.
# =============================================================================

# ---------------------------------------------------------------------------
# Regime Classifier
# ---------------------------------------------------------------------------
# LightGBM multi-class classifier (7 regimes, soft probability output).
# Output: probability vector p ∈ ℝ⁷, sum(p) = 1.0
# Input: 23 atmospheric features defined in DATA_CONTRACTS.md §3
# ---------------------------------------------------------------------------
regime_classifier:
  model_type: lightgbm
  objective: multiclass
  num_class: 7
  metric: multi_logloss
  # Tree structure
  num_leaves: 63
  max_depth: -1            # -1 = unlimited (controlled via num_leaves)
  min_child_samples: 20
  min_child_weight: 1.0e-3
  # Learning
  n_estimators: 500
  learning_rate: 0.05
  subsample: 0.8
  subsample_freq: 5
  colsample_bytree: 0.8
  # Regularisation
  reg_alpha: 0.1           # L1
  reg_lambda: 1.0          # L2
  # Runtime
  n_jobs: -1
  random_state: 42
  verbose: -1
  # Early stopping (used during training only)
  early_stopping_rounds: 50
  # Imbalance handling
  is_unbalance: true
  # Class labels (for reference — must match RegimeLabel enum in DATA_CONTRACTS.md)
  class_labels:
    - ACTIVE_MONSOON
    - BREAK_MONSOON
    - MONSOON_LOW_DEPRESSION
    - COASTAL_RAINFALL
    - OROGRAPHIC_RAINFALL
    - WESTERN_DISTURBANCE
    - TRANSITION_OTHER

# ---------------------------------------------------------------------------
# Mixture-of-Experts (MoE) Combiner
# ---------------------------------------------------------------------------
# Regime-weighted linear combination of expert outputs.
# Final output = Σᵢ pᵢ · expert_i(x)
# ---------------------------------------------------------------------------
moe_combiner:
  # Weighting strategy: 'soft' = use raw probabilities, 'top_k' = top-k experts only
  weighting_strategy: soft
  top_k: 3                 # Only used when weighting_strategy = top_k
  # Minimum probability threshold to include an expert in the mixture
  min_expert_weight: 0.01
  # Output clipping (rainfall cannot be negative)
  output_min: 0.0
  output_max: 500.0        # mm/24h hard cap (sanity check)

# ---------------------------------------------------------------------------
# Per-Regime Expert Models
# Each expert is a LightGBM regressor correcting NWP rainfall for its regime.
# ---------------------------------------------------------------------------

expert_defaults: &expert_defaults
  model_type: lightgbm
  objective: regression_l1   # MAE objective (robust to heavy-rain outliers)
  metric: mae
  num_leaves: 31
  max_depth: -1
  min_child_samples: 30
  n_estimators: 300
  learning_rate: 0.05
  subsample: 0.8
  subsample_freq: 5
  colsample_bytree: 0.7
  reg_alpha: 0.05
  reg_lambda: 0.5
  n_jobs: -1
  random_state: 42
  verbose: -1
  early_stopping_rounds: 40

experts:
  ACTIVE_MONSOON:
    <<: *expert_defaults
    # Active monsoon has large dynamic range — use more leaves
    num_leaves: 63
    n_estimators: 400

  BREAK_MONSOON:
    <<: *expert_defaults
    # Break periods have lower rainfall — tighter model
    num_leaves: 15
    n_estimators: 200

  MONSOON_LOW_DEPRESSION:
    <<: *expert_defaults
    # Heavy rain events dominate — use tweedie for extreme tail
    objective: tweedie
    tweedie_variance_power: 1.5
    metric: tweedie
    num_leaves: 63
    n_estimators: 500

  COASTAL_RAINFALL:
    <<: *expert_defaults
    num_leaves: 31
    n_estimators: 300

  OROGRAPHIC_RAINFALL:
    <<: *expert_defaults
    # Elevation-dependent — more complex relationships
    num_leaves: 63
    n_estimators: 400

  WESTERN_DISTURBANCE:
    <<: *expert_defaults
    # WD is predominantly NW India, shorter training data expected
    num_leaves: 15
    n_estimators: 200
    min_child_samples: 20

  TRANSITION_OTHER:
    <<: *expert_defaults
    # Mixed regime — moderate capacity
    num_leaves: 31
    n_estimators: 300

# ---------------------------------------------------------------------------
# Extreme Rainfall Calibrator
# ---------------------------------------------------------------------------
# Binary/probabilistic classifier for heavy/very-heavy/extremely-heavy rain.
# Outputs exceedance probabilities: P(R ≥ threshold).
# ---------------------------------------------------------------------------
extreme_calibrator:
  model_type: lightgbm
  # Three independent binary classifiers, one per IMD threshold
  thresholds_mm_per_24h:
    heavy: 64.5
    very_heavy: 115.6
    extremely_heavy: 204.5
  classifier:
    objective: binary
    metric: binary_logloss
    num_leaves: 31
    max_depth: 6
    min_child_samples: 50    # Avoid over-fitting on rare extreme events
    n_estimators: 300
    learning_rate: 0.05
    subsample: 0.8
    subsample_freq: 5
    colsample_bytree: 0.7
    reg_alpha: 0.1
    reg_lambda: 1.0
    scale_pos_weight: auto   # Set dynamically from class balance at training time
    n_jobs: -1
    random_state: 42
    verbose: -1
    early_stopping_rounds: 40
  # Isotonic regression post-hoc calibration
  calibration:
    method: isotonic         # Options: isotonic | platt | none
    cv_folds: 5

# ---------------------------------------------------------------------------
# Spatial Post-Processing
# ---------------------------------------------------------------------------
spatial:
  # Gaussian smoothing kernel applied to corrected rainfall field
  smoothing:
    enabled: true
    sigma_degrees: 0.25      # ~28 km at India latitudes
  # District-level aggregation method
  aggregation_method: area_weighted_mean
  # Coordinate reference system for output
  output_crs: EPSG:4326

# ---------------------------------------------------------------------------
# Verification Scorers
# ---------------------------------------------------------------------------
verification:
  # Neighbourhood sizes for FSS (Fractions Skill Score)
  fss_neighbourhood_scales_km: [25, 50, 100, 200]
  # Rainfall thresholds used for categorical scores (CSI, POD, FAR, ETS)
  categorical_thresholds_mm_per_24h: [2.5, 7.5, 35.5, 64.5, 115.6]
  # Grid spacing of verification grid (degrees)
  grid_spacing_deg: 0.25
  # Minimum valid observations required for score computation
  min_obs_count: 10

# ---------------------------------------------------------------------------
# Feature Engineering
# ---------------------------------------------------------------------------
features:
  # Full list defined in DATA_CONTRACTS.md §3; listed here for reference
  # Normalisation is applied before training
  normalisation: standard_scaler   # Options: standard_scaler | min_max | none
  # Missing value strategy
  fill_strategy: median            # Options: median | zero | interpolate
  # Elevation feature source
  dem_source: data/dem/            # DEM tiles directory

# ---------------------------------------------------------------------------
# MLflow Experiment Tracking
# ---------------------------------------------------------------------------
mlflow:
  experiment_name: ramp_dev
  run_tags:
    project: SIH26080
    version: "0.1.0"
    data_mode: SYNTHETIC_DEMO      # Override to REAL when using real data
  # Artifact logging
  log_models: true
  log_feature_importance: true
  log_confusion_matrix: true       # For regime classifier
  log_reliability_diagram: true    # For extreme calibrator
