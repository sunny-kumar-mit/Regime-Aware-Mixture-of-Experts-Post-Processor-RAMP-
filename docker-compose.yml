# =============================================================================
# RAMP — Regime-Aware Mixture-of-Experts Post-Processor (SIH26080)
# MoES / NCMRWF Operational Production & Development Orchestration
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # RAMP FastAPI Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ramp-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - RAMP_DATA_MODE=${RAMP_DATA_MODE:-REAL_OPERATIONAL}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-ramp}:${POSTGRES_PASSWORD:-ramp}@db:5432/${POSTGRES_DB:-ramp_db}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-ramp_db}
      - POSTGRES_USER=${POSTGRES_USER:-ramp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ramp}
      - STORAGE_MODE=POSTGRESQL
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ramp-network

  # ---------------------------------------------------------------------------
  # RAMP React Frontend Dashboard
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ramp-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_MAP_PROVIDER=leaflet
      - VITE_MAP_TILE_URL=https://tile.openstreetmap.org/{z}/{x}/{y}.png
      - VITE_MAP_STYLE_URL=https://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}
    depends_on:
      - backend
    networks:
      - ramp-network

  # ---------------------------------------------------------------------------
  # PostgreSQL + PostGIS Persistent Metadata, Raster & Chunked Storage
  # ---------------------------------------------------------------------------
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: ramp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ramp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ramp}
      POSTGRES_DB: ${POSTGRES_DB:-ramp_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ramp} -d ${POSTGRES_DB:-ramp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ramp-network

  # ---------------------------------------------------------------------------
  # Redis Cache & Pipeline Queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ramp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ramp-network

networks:
  ramp-network:
    driver: bridge

volumes:
  postgres_data:
