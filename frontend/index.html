<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284c7'><path d='M4.5 12a4.5 4.5 0 0 1 8.8-1.2A3.5 3.5 0 0 1 18 14.5a3.5 3.5 0 0 1-3.5 3.5h-10A4.5 4.5 0 0 1 4.5 12z'/></svg>" />
    <meta id="ramp-viewport-meta" name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var userChoice = localStorage.getItem('ramp_view_mode');
          var ua = navigator.userAgent || '';
          var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
          var hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);
          var isSmall = (window.screen && (window.screen.width < 1024 || window.screen.height < 1024)) || (window.innerWidth < 1024);
          var isMobile = isMobileUA || Boolean(hasTouch && isSmall) || isSmall;

          // Default requirement: auto-set to desktop view on mobile / small screens
          var enableDesktop = userChoice === 'desktop' || (userChoice !== 'mobile' && isMobile);

          var meta = document.getElementById('ramp-viewport-meta') || document.querySelector('meta[name="viewport"]');
          if (enableDesktop) {
            var targetWidth = 1280;
            var screenW = (window.screen && window.screen.width) ? window.screen.width : window.innerWidth;
            var scale = Math.min(1.0, Math.max(0.2, (screenW > 0 ? screenW : 440) / targetWidth));
            scale = Math.round(scale * 1000) / 1000;
            if (meta) {
              meta.setAttribute('content', 'width=' + targetWidth + ', initial-scale=' + scale + ', minimum-scale=0.2, maximum-scale=3.0, user-scalable=yes');
            }
            document.documentElement.classList.add('auto-desktop-view');
          } else {
            if (meta) {
              meta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes');
            }
            document.documentElement.classList.remove('auto-desktop-view');
          }
        } catch (e) {
          console.warn('RAMP viewport init warning:', e);
        }
      })();
    </script>
    <title>RAMP | Regime-Aware Monsoon Forecast Post-Processing</title>
    <meta name="description" content="AI/ML Post-Processing of Monsoon Rainfall Forecasts for NCMRWF / MoES - SIH26080" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-monsoon-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
